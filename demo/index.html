<!DOCTYPE html>
<html>
<head>
<title>风场数据可视化平台</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Microsoft YaHei', 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;
    background: #1a1a1a;
    color: #fff;
    overflow: hidden;
}

.container {
    display: flex;
    height: 100vh;
}

.sidebar {
    width: 320px;
    background: #2d2d2d;
    border-right: 1px solid #444;
    padding: 20px;
    overflow-y: auto;
    flex-shrink: 0;
}

.main-content {
    flex: 1;
    position: relative;
    background: #000;
}

/* 高德地图容器样式 */
#amap-container {
    width: 100%;
    height: 100%;
    position: absolute;
    top: 0;
    left: 0;
}

#coastline { 
    background: transparent; /* 设置为透明背景 */
}

#canvas, #coastline { 
    display: block; 
    width: 100%; 
    height: 100%; 
    position: absolute; 
    background: transparent; /* 设置为透明背景 */
}

.sidebar h2 {
    color: #fff;
    margin-bottom: 20px;
    font-size: 18px;
    border-bottom: 2px solid #4CAF50;
    padding-bottom: 10px;
}

.file-upload {
    margin-bottom: 30px;
}

.file-upload label {
    display: block;
    background: #4CAF50;
    color: white;
    padding: 12px 20px;
    border-radius: 6px;
    cursor: pointer;
    text-align: center;
    margin-bottom: 10px;
    transition: background 0.3s;
}

.file-upload label:hover {
    background: #45a049;
}

.file-upload input[type="file"] {
    display: none;
}

.data-list {
    margin-top: 20px;
}

.data-item {
    background: #3d3d3d;
    border: 1px solid #555;
    border-radius: 6px;
    padding: 15px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: all 0.3s;
}

.data-item:hover {
    background: #4d4d4d;
    border-color: #4CAF50;
}

.data-item.active {
    background: #4CAF50;
    border-color: #4CAF50;
}

.data-item h3 {
    font-size: 14px;
    margin-bottom: 8px;
    color: #fff;
}

.data-item p {
    font-size: 12px;
    color: #ccc;
    margin: 4px 0;
}

.refresh-btn {
    width: 100%;
    background: #2196F3;
    color: white;
    border: none;
    padding: 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    margin-top: 20px;
    transition: background 0.3s;
}

.refresh-btn:hover {
    background: #1976D2;
}

.refresh-btn:disabled {
    background: #666;
    cursor: not-allowed;
}

.status {
    margin-top: 10px;
    padding: 10px;
    border-radius: 4px;
    font-size: 12px;
}

.status.loading {
    background: rgba(33, 150, 243, 0.2);
    border: 1px solid #2196F3;
    color: #64B5F6;
}

.status.success {
    background: rgba(76, 175, 80, 0.2);
    border: 1px solid #4CAF50;
    color: #81C784;
}

.status.error {
    background: rgba(244, 67, 54, 0.2);
    border: 1px solid #F44336;
    color: #E57373;
}

.controls-section {
    font-size: 12px;
}

.control-group {
    margin-bottom: 15px;
    display: flex;
    flex-direction: column;
    gap: 5px;
}

.control-group label {
    color: #ccc;
    font-size: 12px;
    font-weight: normal;
}

.control-group input[type="range"] {
    width: 100%;
    height: 4px;
    border-radius: 2px;
    background: #555;
    outline: none;
    -webkit-appearance: none;
}

.control-group input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #4CAF50;
    cursor: pointer;
}

.control-group input[type="range"]::-moz-range-thumb {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #4CAF50;
    cursor: pointer;
    border: none;
}

.control-group span {
    color: #4CAF50;
    font-size: 11px;
    text-align: right;
}

/* 工具提示样式 */
.control-group {
    position: relative;
}

.tooltip {
    visibility: hidden;
    opacity: 0;
    position: absolute;
    bottom: 125%;
    left: 50%;
    transform: translateX(-50%);
    background-color: #333;
    color: #fff;
    text-align: center;
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 11px;
    white-space: nowrap;
    z-index: 1000;
    transition: opacity 0.3s, visibility 0.3s;
    pointer-events: none;
}

.tooltip::after {
    content: "";
    position: absolute;
    top: 100%;
    left: 50%;
    transform: translateX(-50%);
    border: 5px solid transparent;
    border-top-color: #333;
}

.control-group:hover .tooltip {
    visibility: visible;
    opacity: 1;
}

/* 上传进度条样式 */
.upload-progress {
    margin-top: 15px;
    padding: 15px;
    background: #2d2d2d;
    border-radius: 6px;
    border: 1px solid #555;
}

.progress-bar {
    width: 100%;
    height: 8px;
    background: #444;
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 8px;
}

.progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #4CAF50, #81C784);
    border-radius: 4px;
    transition: width 0.3s ease;
    position: relative;
}

.progress-fill::after {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    bottom: 0;
    right: 0;
    background-image: linear-gradient(
        -45deg,
        rgba(255, 255, 255, .2) 25%,
        transparent 25%,
        transparent 50%,
        rgba(255, 255, 255, .2) 50%,
        rgba(255, 255, 255, .2) 75%,
        transparent 75%,
        transparent
    );
    background-size: 50px 50px;
    animation: move 2s linear infinite;
}

@keyframes move {
    0% { background-position: 0 0; }
    100% { background-position: 50px 50px; }
}

.progress-text {
    font-size: 12px;
    color: #ccc;
    text-align: center;
    margin-top: 5px;
}

/* 缩放控制按钮样式 */
.zoom-controls {
    position: absolute;
    top: 20px;
    right: 20px;
    z-index: 1000;
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.zoom-btn {
    width: 40px;
    height: 40px;
    border-radius: 4px;
    background: rgba(45, 45, 45, 0.8);
    border: 1px solid #444;
    color: #fff;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    backdrop-filter: blur(10px);
}

.zoom-btn:hover {
    background: rgba(76, 175, 80, 0.8);
    transform: scale(1.1);
}

.zoom-btn:active {
    transform: scale(0.95);
}

/* 操作提示样式 */
.operation-hint {
    position: absolute;
    bottom: 20px;
    left: 20px;
    z-index: 1000;
    background: rgba(0, 0, 0, 0.6);
    color: #fff;
    padding: 10px 15px;
    border-radius: 6px;
    font-size: 12px;
    backdrop-filter: blur(10px);
}

.operation-hint p {
    margin: 5px 0;
}

.operation-hint span {
    color: #4CAF50;
    font-weight: bold;
}

@media (max-width: 768px) {
    .sidebar {
        width: 280px;
    }
}
</style>
</head>
<body>
<div class="container">
    <div class="sidebar">
        <h2>风场数据管理</h2>
        
        <div class="file-upload">
            <label for="fileInput">上传 NC 文件</label>
            <input type="file" id="fileInput" accept=".nc" multiple>
            <p style="font-size: 12px; color: #ccc; margin-top: 10px;">
                支持 NetCDF (.nc) 格式文件
            </p>
            
            <!-- 上传进度显示 -->
            <div id="uploadProgress" class="upload-progress" style="display: none;">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill" style="width: 0%"></div>
                </div>
                <div class="progress-text" id="progressText">准备上传...</div>
            </div>
        </div>

        <div class="data-list">
            <h3 style="margin-bottom: 15px;">可用数据</h3>
            <div id="dataItems"></div>
        </div>

        <button class="refresh-btn" id="refreshBtn" disabled>
            刷新地图显示
        </button>

        <div class="controls-section" style="margin-top: 20px; padding-top: 20px; border-top: 1px solid #444;">
            <h3 style="margin-bottom: 15px; color: #fff;">风场控制</h3>
            
            <div class="control-group">
                <label for="particleCount">粒子数量:</label>
                <input type="range" id="particleCount" min="1024" max="589824" value="65536" step="1024">
                <span id="particleCountValue">65536</span>
                <div class="tooltip">控制显示的粒子总数。更高的值提供更流畅的效果，但可能影响性能。</div>
            </div>
            
            <div class="control-group">
                <label for="fadeOpacity">衰减透明度:</label>
                <input type="range" id="fadeOpacity" min="0.96" max="0.999" value="0.96" step="0.001">
                <span id="fadeOpacityValue">0.96</span>
                <div class="tooltip">控制粒子轨迹的淡化程度。值越接近1，轨迹保持时间越长。</div>
            </div>
            
            <div class="control-group">
                <label for="speedFactor">速度因子:</label>
                <input type="range" id="speedFactor" min="0.05" max="1.0" value="0.5" step="0.01">
                <span id="speedFactorValue">0.5</span>
                <div class="tooltip">调整粒子移动速度的比例。增加此值使风场流动更快。</div>
            </div>
            
            <div class="control-group">
                <label for="dropRate">消失率:</label>
                <input type="range" id="dropRate" min="0" max="0.1" value="0" step="0.001">
                <span id="dropRateValue">0</span>
                <div class="tooltip">控制粒子的随机消失概率。较高的值使粒子更快重置。</div>
            </div>
            
            <div class="control-group">
                <label for="dropRateBump">消失率峰值:</label>
                <input type="range" id="dropRateBump" min="0" max="0.2" value="0" step="0.001">
                <span id="dropRateBumpValue">0</span>
                <div class="tooltip">在高风速区域增加消失率。这有助于在强风区域保持更多粒子更新。</div>
            </div>
        </div>

        <div id="status" class="status" style="display: none;"></div>
    </div>

    <div class="main-content">
        <div class="zoom-controls">
            <button class="zoom-btn" id="zoomInBtn">+</button>
            <button class="zoom-btn" id="zoomOutBtn">-</button>
        </div>
        <div id="amap-container"></div>
        <!-- <canvas id="coastline"></canvas> -->
        <canvas id="canvas"></canvas>
        
        <div class="operation-hint">
            <p>使用 <span>鼠标拖拽</span> 来移动地图</p>
            <p>使用 <span>缩放按钮</span> 或 <span>滚轮</span> 来缩放地图</p>
        </div>
    </div>
</div>

<!-- 引入高德地图API - 重要：请先到高德开放平台申请API密钥，并替换URL中的"您的高德API密钥" -->
 <script
  type="text/javascript"
  src="https://webapi.amap.com/maps?v=2.0&key=f6c37e8558c3566040b4adb1cfcf6b7f"
></script>
<script src="../dist/wind-gl.js"></script>
<script src="index.js"></script>
<script src="../data-panel.js"></script>
</body>
</html>
